plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rawdatalmuslim.app'
    compileSdk 35

    androidResources {
        noCompress += ['mp3']
    }

    defaultConfig {
        applicationId 'com.rawdatalmuslim.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

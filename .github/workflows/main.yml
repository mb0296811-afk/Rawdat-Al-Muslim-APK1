name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # هذا هو السطر المهم الذي يحل المشكلة ويوجه النظام لمجلد المشروع الداخلي
    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: build
      working-directory: ./Rawdat-Al-Muslim-APK1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ./Rawdat-Al-Muslim-APK1/app/build/outputs/apk/debug/app-debug.apk

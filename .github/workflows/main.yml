name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # توجيه عملية البناء إلى المجلد الصحيح الذي يظهر في صورك
    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: build
      working-directory: ./RawdatAlMuslim-GitHub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ./RawdatAlMuslim-GitHub/app/build/outputs/apk/debug/app-debug.apk
